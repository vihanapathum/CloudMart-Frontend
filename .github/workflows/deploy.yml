name: Deploy to Cloud Run

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: project-1023ef7b-f75c-4e17-ab5
  REGION: asia-south1
  SERVICE: cloudmart-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/117528253951/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: cloudmart-deployer@project-1023ef7b-f75c-4e17-ab5.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud builds submit --tag asia-south1-docker.pkg.dev/${{ env.PROJECT_ID }}/cloudmart-frontend/frontend:${{ github.sha }} .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=asia-south1-docker.pkg.dev/${{ env.PROJECT_ID }}/cloudmart-frontend/frontend:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080
